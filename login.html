<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Up - Kirish</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #e0eafc, #cfdef3); 
            color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; 
        }
        .container { 
            background: #fff; padding: 30px 25px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 90%; text-align: center;
        }
        .logo { color: #6a1b9a; font-weight: 900; font-size: 28px; margin-bottom: 5px; letter-spacing: 1px;}
        .slogan { font-size: 14px; color: #777; margin-bottom: 25px; font-style: italic; }
        
        .btn { 
            display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; 
            margin-bottom: 15px; transition: 0.3s; color: white;
        }
        .btn-telegram { background-color: #0088cc; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        .btn-submit { background-color: #6a1b9a; box-shadow: 0 4px 10px rgba(106,27,154,0.3); }
        .btn-success { background-color: #388e3c; box-shadow: 0 4px 10px rgba(56,142,60,0.3); }

        input[type="text"] { 
            width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; 
            font-size: 16px; margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: #6a1b9a; }

        .hidden { display: none !important; }
        .error-msg { color: #d32f2f; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
        
        .welcome-icon { font-size: 50px; margin-bottom: 10px; }
        .welcome-name { color: #6a1b9a; font-size: 24px; margin-bottom: 15px; font-weight: bold; }
        .time-badge { 
            background: #e8f5e9; color: #2e7d32; padding: 10px 15px; 
            border-radius: 10px; font-weight: bold; margin-bottom: 20px; display: inline-block; 
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1-OYNA: Kirish qismi -->
        <div id="auth-section">
            <div class="logo">ENGLISH<span style="color:#9c27b0">UP</span></div>
            <div class="slogan">Sizning orzuyingiz kaliti!</div>
            
            <!-- Telegram havolasi (Buni o'zingiznikiga o'zgartirasiz) -->
            <a href="https://t.me/EnglishUpAdmin" target="_blank" class="btn btn-telegram">✈️ Obuna sotib olish</a>
            
            <p style="font-size: 13px; color: #555; margin-bottom: 10px;">To'lov qilib, kod olgan bo'lsangiz, uni kiriting:</p>
            
            <input type="text" id="codeInput" placeholder="Kodingizni kiriting...">
            <div id="errorMsg" class="error-msg hidden">Noto'g'ri kod! Iltimos, qaytadan urinib ko'ring.</div>
            
            <button class="btn btn-submit" onclick="checkCode()">Tasdiqlash</button>
        </div>

        <!-- 2-OYNA: Ism kiritish -->
        <div id="name-section" class="hidden">
            <div class="welcome-icon">🎉</div>
            <div class="logo">Kod qabul qilindi!</div>
            <p style="font-size: 14px; color: #555; margin: 15px 0;">Tizimga kirish uchun ismingizni kiriting:</p>
            
            <input type="text" id="userNameInput" placeholder="Ismingiz...">
            <button class="btn btn-submit" onclick="saveUser()">Boshlash</button>
        </div>

        <!-- 3-OYNA: Xush kelibsiz -->
        <div id="welcome-section" class="hidden">
            <div class="welcome-icon">👋</div>
            <div class="logo">Xush kelibsiz!</div>
            <div class="welcome-name" id="welcomeName">Ism</div>
            <div class="time-badge" id="timeLeft">Yuklanmoqda...</div>
            <a href="lessons/index.html" class="btn btn-success">Darslarga o'tish</a>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. ADMIN SOZLAMALARI
        // ==========================================
        // Admin paneldagi kodlar bilan bir xil bo'lishi kerak
        const validCodes = {
            "UP-1M-X8F2": 30, // 1 oylik
            "UP-3M-A1B2": 90, // 3 oylik
            "UP-5M-C3D4": 150, // 5 oylik
            "UP-8M-E5F6": 240  // 8 oylik
        };

        let userData = JSON.parse(localStorage.getItem('englishUpUser'));

        // ==========================================
        // 2. ISHLASH MANTIQI
        // ==========================================
        window.onload = function() {
            if (userData && userData.name && userData.expireDate) {
                let now = new Date().getTime();
                if (now < userData.expireDate) {
                    showWelcome(); // Vaqti bor, eslab qolgan
                } else {
                    localStorage.removeItem('englishUpUser'); // Vaqti tugagan
                }
            }
        };

        function checkCode() {
            let input = document.getElementById('codeInput').value.trim().toUpperCase();
            let errorMsg = document.getElementById('errorMsg');

            if (validCodes[input]) {
                let days = validCodes[input];
                let expireDate = new Date().getTime() + (days * 24 * 60 * 60 * 1000);
                
                localStorage.setItem('tempExpire', expireDate);
                
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('name-section').classList.remove('hidden');
                errorMsg.classList.add('hidden');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function saveUser() {
            let name = document.getElementById('userNameInput').value.trim();
            if (name !== "") {
                let expireDate = localStorage.getItem('tempExpire');
                
                let finalData = {
                    name: name,
                    expireDate: parseInt(expireDate)
                };
                
                localStorage.setItem('englishUpUser', JSON.stringify(finalData));
                localStorage.removeItem('tempExpire');
                
                showWelcome();
            } else {
                alert("Iltimos, ismingizni kiriting!");
            }
        }

        function showWelcome() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('name-section').classList.add('hidden');
            document.getElementById('welcome-section').classList.remove('hidden');
            
            document.getElementById('welcomeName').innerText = userData.name;
            
            let now = new Date().getTime();
            let timeDiff = userData.expireDate - now;
            let daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));
            
            document.getElementById('timeLeft').innerText = `Sizda yana ${daysLeft} kun obuna qoldi`;
        }
    </script>
</body>
</html>
