<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons | English Up</title>
    <style>
        /* Asosiy dizayn */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        /* Yuqori menyu */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: #fff; border-bottom: 1px solid #e0e0e0;
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn { text-decoration: none; color: #555; font-size: 16px; font-weight: 600; }
        .logo { color: #6a1b9a; font-weight: bold; font-size: 18px; letter-spacing: 1px;}
        .theme-icon { font-size: 20px; cursor: pointer; }

        /* Kontent qismi */
        .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }
        
        /* Darajalar kartochkalari */
        .level-card {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 20px; margin-bottom: 15px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block; text-decoration: none;
        }
        .level-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: #b39ddb;
        }
        .level-title { color: #1565c0; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .level-desc { color: #666; font-size: 14px; margin-bottom: 5px; }
        .level-count { color: #333; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Yuqori menyu -->
    <div class="top-bar">
        <a href="../index.html" class="back-btn">← Back</a>
        <div class="logo">ENGLISH<span style="color:#9c27b0">UP</span></div>
        <div class="theme-icon">☀️</div>
    </div>

    <!-- Darajalar chiqadigan joy -->
    <div class="container">
        
        <!-- Beginner -->
        <a href="beginner.html" class="level-card">
            <div class="level-title">Beginner</div>
            <div class="level-desc">Boshlang'ich daraja</div>
            <div class="level-count">12 ta dars</div>
        </a>

        <!-- Elementary -->
        <div class="level-card">
            <div class="level-title">Elementary</div>
            <div class="level-desc">Keyingi daraja</div>
            <div class="level-count">Tez kunda...</div>
        </div>

        <!-- Pre-Intermediate -->
        <div class="level-card">
            <div class="level-title">Pre-Intermediate</div>
            <div class="level-desc">O'rta daraja</div>
            <div class="level-count">Tez kunda...</div>
        </div>

        <!-- Intermediate -->
        <div class="level-card">
            <div class="level-title">Intermediate</div>
            <div class="level-desc">O'rta daraja</div>
            <div class="level-count">Tez kunda...</div>
        </div>

        <!-- Upper-Intermediate -->
        <div class="level-card">
            <div class="level-title">Upper-Intermediate</div>
            <div class="level-desc">Yuqori daraja</div>
            <div class="level-count">Tez kunda...</div>
        </div>

        <!-- IELTS -->
        <div class="level-card">
            <div class="level-title">IELTS</div>
            <div class="level-desc">IELTS darslari</div>
            <div class="level-count">Tez kunda...</div>
        </div>

    </div>

</body>
</html>
